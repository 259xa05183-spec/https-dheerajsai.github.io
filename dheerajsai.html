<style>
/* Layout: left rail navigation + one working column; detail view replaces the list; AI assistant docks bottom-right. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#58656F; --line:#D8DEE6;
  --accent:#0F5C7A; --accent-ink:#FFFFFF; --accent-soft:#DCEEF5;
  --ok:#1B7F4B; --ok-soft:#DDF1E5; --warn:#9A5B00; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#F8DDDA; --info:#3B4DA6; --info-soft:#E2E6F8;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 16px rgba(21,32,43,.06);
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161E27; --surface-2:#1B2530; --ink:#E6ECF2; --muted:#9AA8B5; --line:#2A3643;
  --accent:#5FB6D6; --accent-ink:#06222D; --accent-soft:#14323E;
  --ok:#55C98A; --ok-soft:#133224; --warn:#F0B35A; --warn-soft:#3A2B10; --bad:#FF8B82; --bad-soft:#3F1A18; --info:#9DAAF2; --info-soft:#1F2547;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E27; --surface-2:#1B2530; --ink:#E6ECF2; --muted:#9AA8B5; --line:#2A3643;
  --accent:#5FB6D6; --accent-ink:#06222D; --accent-soft:#14323E;
  --ok:#55C98A; --ok-soft:#133224; --warn:#F0B35A; --warn-soft:#3A2B10; --bad:#FF8B82; --bad-soft:#3F1A18; --info:#9DAAF2; --info-soft:#1F2547;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;margin:0}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:16px 96px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:18px;padding-top:6px}
.brand{display:flex;flex-direction:column;gap:2px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--surface);color:var(--ink)}

.who{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;font-size:12px}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.notice{background:var(--info-soft);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--info);padding:10px 12px;border-radius:8px;font-size:13px}
.notice.warn{border-left-color:var(--warn);background:var(--warn-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.kpi .n{font-family:var(--f-mono);font-size:28px;font-weight:500;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)} .kpi.ok .n{color:var(--ok)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:14px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--surface-2);color:var(--muted);border-color:var(--line)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
th.sortable{cursor:pointer}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.sev{display:inline-block;width:4px;align-self:stretch;border-radius:2px}
.risk{display:inline-flex;align-items:center;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:70px}
.bar i{display:block;height:100%}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .d{color:var(--muted);font-size:13px;grid-column:1/-1}
.issues{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.issue{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.issue .pill{flex:none}

.cmp td:nth-child(3){background:transparent}
.cmp input{width:100%}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kv div span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv div b{font-weight:500}

.decision{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.decision.locked{background:var(--surface-2)}
.aibox{border:1px dashed var(--accent);border-radius:10px;padding:12px 14px;background:var(--accent-soft)}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.log div:last-child{border-bottom:0}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 200px}
.chart{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hbar .fill{height:100%;border-radius:3px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* AI assistant */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:999px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.chat .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chat form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat form input{flex:1;min-width:0}

.modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(520px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:80;font-size:13px;max-width:calc(100vw - 32px)}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px}
  .rail{position:static;gap:10px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap}
  .who{border-top:0;padding-top:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  .proto{display:none}
  .log div{grid-template-columns:minmax(0,1fr)}
  .hbar{grid-template-columns:84px minmax(0,1fr) 30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="shell">
  <aside class="rail">
    <div class="brand"><b>Scrutiny Desk</b><span>Application and document checks for the approving authority</span></div>

<button class="fab" id="fab" type="button" aria-controls="chat">Ask the assistant</button>

</section>
<div id="overlay"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 86400000;
const todayISO = () => new Date().toISOString().slice(0, 10);
const addDays = (n, from) => new Date((from ? new Date(from).getTime() : Date.now()) + n * DAY).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / DAY);
const fmtDate = d => { if (!d) return "none"; const x = new Date(d + "T00:00:00Z"); return x.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }); };
const fmtTime = t => new Date(t).toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function sim(a, b) { a = norm(a); b = norm(b); if (!a && !b) return 1; const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 1; }
function fnv(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, "0"); }
const seedHash = s => "seed" + fnv(s) + fnv(s + "x") + fnv(s + "y") + fnv(s + "z");

/* ---------- reference data ---------- */
const DOCS = [
  { key: "landDeed", label: "Land ownership or lease deed", source: "State land registry", holder: "trust", expires: false },
  { key: "trustReg", label: "Trust or society registration", source: "State Registrar of Societies", holder: "trust", expires: false },
  { key: "landUse", label: "Land-use conversion certificate", source: "State revenue department", holder: "trust", expires: false },
  { key: "buildingPlan", label: "Approved building plan", source: "Local planning authority", holder: "college", expires: true },
  { key: "fireNoc", label: "Fire safety certificate", source: "State fire services", holder: "college", expires: true },
  { key: "stateNoc", label: "State government NOC", source: "State higher education department", holder: "college", expires: true },
  { key: "affiliation", label: "University affiliation letter", source: "Affiliating university", holder: "college", expires: true },
  { key: "financials", label: "Audited financial statements", source: "ICAI UDIN portal", holder: "trust", expires: false },
  { key: "fdr", label: "FDR or bank guarantee", source: "Issuing bank", holder: "trust", expires: true },
  { key: "facultyList", label: "Faculty list with qualifications", source: "AICTE faculty records", holder: "college", expires: false }
];
const DOCMAP = Object.fromEntries(DOCS.map(d => [d.key, d]));
const FIELDS = [
  { key: "trustName", label: "Trust or society name", kind: "text" },
  { key: "trustRegNo", label: "Registration number", kind: "id" },
  { key: "panNo", label: "Trust PAN", kind: "id" },
  { key: "collegeName", label: "Institution name", kind: "text" },
  { key: "principal", label: "Principal or director", kind: "text" },
  { key: "landArea", label: "Land area (acres)", kind: "num" },
  { key: "builtUp", label: "Built-up area (sq m)", kind: "num" }
];
const SOURCES = [
  { name: "State land registry", note: "Land deeds and lease records" },
  { name: "State Registrar of Societies", note: "Trust and society registration" },
  { name: "State fire services", note: "Fire safety certificates" },
  { name: "Affiliating university", note: "Affiliation letters" },
  { name: "ICAI UDIN portal", note: "Audited statements signed by a chartered accountant" },
  { name: "Issuing bank", note: "FDR and bank guarantees" },
  { name: "AICTE faculty records", note: "Faculty lists and qualifications" }
];
const DEFAULT_RULES = [
  { id: "fsr", label: "Students per faculty member (at most)", metric: "fsr", op: "<=", value: 20, unit: "students" },
  { id: "land", label: "Land area (at least)", metric: "landArea", op: ">=", value: 2.5, unit: "acres" },
  { id: "built", label: "Built-up area per student (at least)", metric: "builtPer", op: ">=", value: 4, unit: "sq m" },
  { id: "labs", label: "Laboratories (at least)", metric: "labs", op: ">=", value: 6, unit: "labs" },
  { id: "lib", label: "Library titles (at least)", metric: "libraryTitles", op: ">=", value: 3000, unit: "titles" },
  { id: "fdr", label: "Reserve fund FDR (at least)", metric: "fdrLakh", op: ">=", value: 20, unit: "lakh INR" }
];

/* ---------- seed data ---------- */
function makeApp(n, o) {
  const id = "APP-2026-" + String(n).padStart(4, "0");
  const trust = o.trust, college = o.college;
  const fields = { trustName: trust, trustRegNo: o.reg, panNo: o.pan, collegeName: college, principal: o.principal, landArea: o.land, builtUp: o.built };
  const docs = {};
  DOCS.forEach((d, i) => {
    const issued = addDays(-(220 + ((n * 37 + i * 91) % 600)));
    docs[d.key] = {
      file: d.key + "_" + id.slice(-4) + ".pdf", size: 180000 + ((n * 13 + i * 29) % 90) * 5000, issuedOn: issued,
      expiresOn: d.expires ? addDays(200 + ((n * 23 + i * 47) % 400)) : null,
      holder: d.holder === "trust" ? trust : college, refNo: d.key.slice(0, 3).toUpperCase() + "/" + (2022 + (i % 4)) + "/" + (1000 + n * 7 + i * 13),
      hash: seedHash(id + d.key), signals: [], verify: "verified", seeded: true
    };
  });
  return {
    id, college, state: o.state, city: o.city, type: o.type, program: o.program, intake: o.intake, submittedOn: addDays(-(3 + n % 9)),
    fields, record: { ...fields }, docs, metrics: { students: o.intake, faculty: Math.ceil(o.intake / 14), labs: 8, libraryTitles: 5200, fdrLakh: 30 },
    status: "new", lastCheck: null, decision: null
  };
}
function seed() {
  const A = [];

    else if (left <= 60) { issues.push({ sev: "low", text: "Expires on " + fmtDate(d.expiresOn) + " (in " + left + " days). Ask for a renewed copy." }); bump("expiring"); }
  }
  if (d.issuedOn && d.issuedOn > app.submittedOn) { issues.push({ sev: "high", text: "Issue date " + fmtDate(d.issuedOn) + " is after the submission date " + fmtDate(app.submittedOn) + "." }); bump("incorrect"); }
  if (d.issuedOn && d.expiresOn && d.expiresOn <= d.issuedOn) { issues.push({ sev: "high", text: "Expiry date is on or before the issue date." }); bump("incorrect"); }
  if (!d.refNo) { issues.push({ sev: "med", text: "Reference or certificate number is missing." }); bump("incorrect"); }

    if (s < 0.85) { issues.push({ sev: "high", text: "Document is issued to “" + d.holder + "”, which does not match “" + want + "”." }); bump("incorrect"); }
    else if (s < 0.97) { issues.push({ sev: "low", text: "Name on the document differs slightly from the application (“" + d.holder + "”)." }); }

  if ((d.signals || []).length) bump("suspicious");

/* ---------- file inspection (runs on the viewer's device) ---------- */
async function inspectFile(file) {
  const out = { name: file.name, size: file.size, signals: [], hash: null };
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (!["pdf", "jpg", "jpeg", "png"].includes(ext)) out.signals.push("Unsupported file type ." + ext + " (expected PDF, JPG or PNG)");
  const buf = await file.arrayBuffer();
  const b = new Uint8Array(buf.slice(0, 8));
  const isPdf = String.fromCharCode(...b.slice(0, 4)) === "%PDF", isPng = b[0] === 0x89 && b[1] === 0x50, isJpg = b[0] === 0xFF && b[1] === 0xD8;
  if (ext === "pdf" && !isPdf) out.signals.push("File name says PDF but the contents are not a PDF");
  if (ext === "png" && !isPng) out.signals.push("File name says PNG but the contents are not a PNG image");
  if ((ext === "jpg" || ext === "jpeg") && !isJpg) out.signals.push("File name says JPG but the contents are not a JPEG image");
  const editors = /photoshop|gimp|canva|paint\.net|illustrator|inkscape|pixlr|sejda|ilovepdf|smallpdf|affinity/i;
  const text = (isPdf ? new TextDecoder("latin1").decode(buf.slice(0, 3 * 1024 * 1024)) : new TextDecoder("latin1").decode(buf.slice(0, 65536)));
  if (isPdf) {
    const m = [...text.matchAll(/\/(Producer|Creator)\s*\(([^)]{1,80})\)/g)].find(x => editors.test(x[2]));
    if (m) out.signals.push("PDF " + m[1].toLowerCase() + " field names an editing tool (" + m[2].trim() + ")");
    const c = text.match(/\/CreationDate\s*\(D:(\d{8})/), mo = text.match(/\/ModDate\s*\(D:(\d{8})/);
    if (c && mo) { const f = s => s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8); const gap = daysBetween(f(c[1]), f(mo[1])); if (gap > 1) out.signals.push("PDF was modified " + gap + " days after it was created"); }
  } else if ((isJpg || isPng) && editors.test(text)) out.signals.push("Image metadata names an editing tool");
  try { const h = await crypto.subtle.digest("SHA-256", buf); out.hash = [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { out.hash = "fnv" + fnv(text) + fnv(String(file.size)); }
  return out;
}

  if (e.key === "Enter" && e.target.matches && e.target.matches("tr.click")) ACTIONS.openApp(e.target);
});
document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset || t.dataset.bind === undefined) return;
  const b = t.dataset.bind;
  if (b === "q" || b === "status" || b === "level" || b === "state") { ui.f[b] = t.value; renderTable(); }
});
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset || t.dataset.bind === undefined) return;
  const b = t.dataset.bind;
  if (b === "field") { const a = getApp(ui.appId), f = FIELDS.find(x => x.key === t.dataset.k); a.fields[f.key] = f.kind === "num" ? Number(t.value) : t.value.trim(); addLog("edited " + f.label + " on " + a.id + "."); save(); render(); }
  else if (b === "metric") { const a = getApp(ui.appId); a.metrics[t.dataset.k] = Number(t.value) || 0; addLog("updated reported figures on " + a.id + "."); save(); render(); }
  else if (b === "rule") { const i = Number(t.dataset.i); S.rules[i].value = Number(t.value) || 0; addLog("changed norm “" + S.rules[i].label + "” to " + S.rules[i].value + "."); save(); renderNav(); updateChatCtx(); toast("Norm updated"); }
});
document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-form]"); if (!form) return; e.preventDefault();
  const kind = form.dataset.form;
  if (kind === "signin") { S.officer = { name: $("#so-name").value.trim(), empId: $("#so-id").value.trim() }; addLog("signed in as an authorised official."); save(); closeModal(); render(); toast("Signed in"); }
  else if (kind === "decision") {
    const type = $("#dec-type").value, remarks = $("#dec-remarks").value.trim();
    if (!type) { toast("Choose a decision"); return; } if (remarks.length < 10) { toast("Add remarks of at least 10 characters"); return; }
    const a = getApp(form.dataset.id); pendingDecision = { id: a.id, type, remarks };
    const word = { approved: "Approve", rejected: "Reject", clarification: "Seek clarification on" }[type];
    showModal('<h3>' + word + " " + esc(a.college) + "?</h3><p style=\"margin:0\">This is recorded under your name and ID in the audit log.</p><div class=\"card flat\"><div class=\"eyebrow\">Remarks</div><p style=\"margin:4px 0 0\">" + esc(remarks) + '</p></div><div class="row"><button class="btn ' + (type === "approved" ? "ok" : type === "rejected" ? "bad" : "warn") + '" type="button" data-act="confirmDecision">Confirm ' + word.toLowerCase() + '</button><button class="btn" type="button" data-act="closeModal">Go back</button></div>');
  }
  else if (kind === "attach") {
    const a = getApp(ui.appId), k = form.dataset.k, file = $("#at-file").files[0]; if (!file) return;
    $("#at-go").disabled = true; $("#at-go").textContent = "Checking file…";
    const info = await inspectFile(file);
    a.docs[k] = { file: info.name, size: info.size, issuedOn: $("#at-issued").value, expiresOn: DOCMAP[k].expires ? $("#at-exp").value : null, holder: $("#at-holder").value.trim(), refNo: $("#at-ref").value.trim(), hash: info.hash, signals: info.signals, verify: null, seeded: false };
    addLog("attached " + DOCMAP[k].label + " to " + a.id + (info.signals.length ? " (" + info.signals.length + " file warning(s))." : "."));
    save(); closeModal(); render(); toast(info.signals.length ? "Attached with " + info.signals.length + " warning(s)" : "Attached and checked");
  }
  else if (kind === "newapp") {
    const v = id => $("#na-" + id).value.trim(), n = id => Number($("#na-" + id).value) || 0;
    const num = Math.max(...S.apps.map(x => Number(x.id.slice(-4)))) + 1;
    const known = S.apps.find(x => x.record.trustRegNo && x.record.trustRegNo.toUpperCase() === v("reg").toUpperCase());
    const fields = { trustName: v("trust"), trustRegNo: v("reg"), panNo: v("pan").toUpperCase(), collegeName: v("college"), principal: v("principal"), landArea: n("land"), builtUp: n("built") };
    const a = { id: "APP-2026-" + String(num).padStart(4, "0"), college: v("college"), state: v("state"), city: v("city"), type: $("#na-type").value, program: v("program"), intake: n("intake"), submittedOn: todayISO(), fields, record: known ? { ...known.record } : { trustName: "", trustRegNo: "", panNo: "", collegeName: "", principal: "", landArea: "", builtUp: "" }, docs: {}, metrics: { students: n("intake"), faculty: n("faculty"), labs: n("labs"), libraryTitles: n("lib"), fdrLakh: n("fdr") }, status: "new", lastCheck: null, decision: null };
    S.apps.push(a); addLog("created " + a.id + " for " + a.college + (known ? ", matched to an existing record by registration number." : ", no existing record found.")); save(); closeModal(); go("detail", a.id); toast("Application created. Attach documents next.");
  }
});

/* ---------- assistant ---------- */
let sampleFn = null, chat = [], chatBusy = false;
const CHIPS_Q = ["What needs attention first?", "Which documents are missing or expired?", "Any duplicate or suspicious documents?", "How many applications are pending?", "Explain the norms"];
function updateChatCtx() { const a = ui.view === "detail" ? getApp(ui.appId) : null; const el = $("#chatCtx"); if (el) el.textContent = a ? a.college + " (" + a.id.slice(-4) + ")" : "Whole queue"; renderChips(); }
function renderChips() { const a = ui.view === "detail" ? getApp(ui.appId) : null; const list = (a ? ["Summarise this application", "What should I ask the institution for?", "Why is the risk score what it is?"] : []).concat(CHIPS_Q).slice(0, 5); $("#chips").innerHTML = list.map(q => '<button type="button" data-chip="' + esc(q) + '">' + esc(q) + "</button>").join(""); }
function renderMsgs() {
  $("#msgs").innerHTML = chat.map((m, i) => '<div class="msg ' + m.role + '">' + esc(m.text) + (m.acts && m.acts.length ? '<div class="acts">' + m.acts.map(x => '<button class="btn sm" type="button" data-act="openApp" data-id="' + x + '">Open ' + x.slice(-4) + "</button>").join("") + "</div>" : "") + "</div>").join("");
  const box = $("#msgs"); box.scrollTop = box.scrollHeight;
}
function findApp(q) {
  const m = q.match(/(?:app-)?(?:2026-)?(\d{4})\b/); if (m) { const a = S.apps.find(x => x.id.endsWith(m[1])); if (a) return a; }
  const n = norm(q); const a = S.apps.find(x => n.includes(norm(x.college.split(" ")[0])) && norm(x.college.split(" ")[0]).length > 3); if (a) return a;
  if (/\b(all|queue|applications|which|how many|any|first|overall|norms?|rules?)\b/.test(n)) return null;
  return ui.view === "detail" ? getApp(ui.appId) : null;
}
function brief(a) {
  const r = analyze(a); const L = [a.college + " (" + a.id + "): " + r.level + " risk, score " + r.score + ". Status: " + statusLabel[a.status] + "."];
  r.docResults.filter(x => x.status !== "ok" && x.status !== "unverified").forEach(x => L.push("- " + x.def.label + ": " + DOCPILL[x.status][1].toLowerCase() + ". " + (x.issues.find(i => i.sev !== "low") || x.issues[0] || { text: "" }).text));
  r.cmp.filter(c => c.status === "mismatch").forEach(c => L.push("- " + c.f.label + " differs from the record (application " + c.a + ", record " + c.r + ")."));
  r.comp.filter(c => !c.pass && !c.docs).forEach(c => L.push("- Norm not met: " + c.text + "."));
  if (L.length === 1) L.push("No blocking findings.");
  L.push("Suggestion: " + r.rec + " An authorised official makes the decision.");
  return L.join("\n");
}
function localAnswer(q) {
  const t = norm(q), a = findApp(q), all = S.apps.map(x => ({ a: x, r: analyze(x) })), open = all.filter(x => !isFinal(x.a));
  const ids = xs => xs.map(x => x.a.id);
  if (/\b(hi|hello|hey)\b/.test(t) && t.length < 12) return { text: "Hello. Ask about an application, the risk scores, missing or expired documents, or the norms." };
  if (/approve|reject|decid|decision|final/.test(t)) return { text: "I can't approve or reject anything. I flag issues and suggest a next step. An authorised AICTE official records the decision on the Officer decision tab of each file." + (a ? "\n\n" + a.college + " currently shows: " + analyze(a).rec : "") , acts: a ? [a.id] : [] };
  if (/norm|rule|threshold|ratio|standard/.test(t)) return { text: "Norms in use (editable on the Rules and norms page):\n" + S.rules.map(r => "- " + r.label + ": " + r.value + " " + r.unit).join("\n") + "\n- All mandatory documents submitted and in date\n\nThese are placeholder defaults. Check them against the current AICTE Approval Process Handbook." };
  if (/duplicate|suspicious|fake|forg|tamper|manipul|fraud|edited|authentic/.test(t)) {
    const s = all.filter(x => x.r.suspicious.length); if (!s.length) return { text: "No suspicious documents in the queue right now." };
    return { text: "Documents flagged as suspicious:\n" + s.map(x => "- " + x.a.college + " (" + x.a.id.slice(-4) + "): " + x.r.suspicious.map(d => d.def.label + " (" + d.issues.filter(i => i.sev === "high").map(i => i.text.replace(/\.$/, "")).join("; ") + ")").join("; ")).join("\n") + "\n\nThese are signals, not proof. An official should confirm with the issuing body.", acts: ids(s) };
  }
  if (/missing|expire|incorrect|not submitted|pending doc/.test(t) && !a) {
    const s = all.filter(x => x.r.missing.length || x.r.expired.length || x.r.incorrect.length); if (!s.length) return { text: "Every submitted file has all mandatory documents in date." };
    return { text: s.map(x => "- " + x.a.college + " (" + x.a.id.slice(-4) + "): " + [x.r.missing.length && "missing " + x.r.missing.map(d => d.def.label).join(", "), x.r.expired.length && "expired " + x.r.expired.map(d => d.def.label).join(", "), x.r.incorrect.length && "incorrect " + x.r.incorrect.map(d => d.def.label).join(", ")].filter(Boolean).join("; ")).join("\n"), acts: ids(s) };
  }
  if (/attention|first|priorit|risk|worst|urgent|high/.test(t) && !a) {
    const s = open.slice().sort((p, q2) => q2.r.score - p.r.score).slice(0, 4); if (!s.length) return { text: "No open applications." };
    return { text: "Highest risk among open applications:\n" + s.map(x => "- " + x.a.college + " (" + x.a.id.slice(-4) + "): " + x.r.level + ", score " + x.r.score + ". " + x.r.rec).join("\n"), acts: ids(s) };
  }
  if (/how many|pending|count|queue|overview|status|total/.test(t) && !a) {
    const c = s => S.apps.filter(x => x.status === s).length;
    return { text: S.apps.length + " applications. " + c("new") + " await the AI check, " + c("ai-checked") + " are ready for an officer, " + c("clarification") + " are waiting on the institution, " + c("approved") + " approved, " + c("rejected") + " rejected. " + open.filter(x => x.r.level === "High").length + " open file(s) are high risk." };
  }
  if (a && /ask|request|need|deficien|clarif|next/.test(t)) {
    const r = analyze(a), L = [];
    r.missing.forEach(d => L.push("Submit " + d.def.label.toLowerCase() + "."));
    r.expired.forEach(d => L.push("Provide a renewed " + d.def.label.toLowerCase() + "."));
    r.incorrect.forEach(d => L.push("Correct or replace " + d.def.label.toLowerCase() + ": " + (d.issues.find(i => i.sev !== "low") || { text: "" }).text));
    r.suspicious.forEach(d => L.push("Explain or replace " + d.def.label.toLowerCase() + ". " + d.issues.filter(i => i.sev === "high")[0].text));
    r.mism.forEach(c => L.push("Reconcile " + c.f.label.toLowerCase() + " with the record."));
    r.comp.filter(c => !c.pass && !c.docs).forEach(c => L.push("Show how the norm “" + c.text.toLowerCase() + "” is met."));
    return { text: L.length ? "Points to raise with " + a.college + ":\n" + L.map(x => "- " + x).join("\n") : a.college + " has nothing to raise from the automated checks.", acts: [a.id] };
  }
  if (a && /why|score/.test(t)) { const r = analyze(a); return { text: a.college + " scores " + r.score + " of 100. Each high finding adds 22, medium 10, low 3. A field mismatch against the record adds 15 and a small difference 4. Each unmet norm adds 6. Any suspicious document makes the level High.\n\n" + brief(a), acts: [a.id] }; }
  if (a) return { text: brief(a), acts: [a.id] };
  return { text: "I can answer from the applications in this tool. Try: which applications need attention first, which documents are missing, any duplicate or suspicious documents, or ask about one by name or number such as 0143." };
}
function chatData() {
  const apps = S.apps.map(a => { const r = analyze(a); return { id: a.id, college: a.college, state: a.state, type: a.type, program: a.program, status: statusLabel[a.status], riskScore: r.score, riskLevel: r.level, suggestion: r.rec, documentFindings: r.docResults.filter(x => x.status !== "ok").map(x => x.def.label + ": " + DOCPILL[x.status][1] + (x.issues.length ? " - " + x.issues.map(i => i.text).join(" ") : "")), recordMismatches: r.cmp.filter(c => c.status === "mismatch").map(c => c.f.label + " (application " + c.a + " vs record " + c.r + ")"), normsNotMet: r.comp.filter(c => !c.pass && !c.docs).map(c => c.text) }; });
  return JSON.stringify({ today: todayISO(), openedFile: ui.view === "detail" ? ui.appId : null, norms: S.rules.map(r => r.label + " " + r.value + " " + r.unit), applications: apps });
}
async function ask(q) {
  if (chatBusy || !q.trim()) return; chatBusy = true; $("#chatSend").disabled = true;
  chat.push({ role: "u", text: q }); chat.push({ role: "a", text: "Thinking…" }); renderMsgs();
  const idx = chat.length - 1;
  const fallback = note => { const r = localAnswer(q); chat[idx] = { role: "a", text: (note ? note + "\n\n" : "") + r.text, acts: r.acts }; };
  if (sampleFn) {
    const history = chat.slice(0, -2).slice(-6).map(m => (m.role === "u" ? "Official: " : "Assistant: ") + m.text).join("\n");
    const prompt = "You are the review assistant inside Scrutiny Desk, a prototype that helps AICTE officials screen college applications. Answer only from the DATA below. Be brief and concrete in plain text without markdown tables. You assist and never approve or reject an application: when asked to decide, say an authorised official decides. Do not call a document genuine or fake; report what the checks found. Source verification for sample applications is simulated. If the data lacks what is needed, say so. Mention application IDs in full (APP-2026-0143 style) when pointing to a file.\n\nDATA:\n" + chatData() + "\n\nCONVERSATION SO FAR:\n" + history + "\n\nOfficial: " + q + "\nAssistant:";
    try {
      const out = await sampleFn(prompt, { cache: false, modelTier: "quick", onText: p => { chat[idx] = { role: "a", text: p.text }; renderMsgs(); } });
      const text = (out && out.text) || chat[idx].text; const ids = [...new Set((text.match(/APP-2026-\d{4}/g) || []))].filter(id => getApp(id));
      chat[idx] = { role: "a", text, acts: ids };
    } catch (e) { if (e && e.code === "not_granted") sampleFn = null; fallback(e && e.code === "not_granted" ? "AI model access was declined, so this answer comes from the tool's own data." : "The AI model did not respond, so this answer comes from the tool's own data."); }
  } else { await wait(250); fallback(""); }
  chatBusy = false; $("#chatSend").disabled = false; renderMsgs();
}
function openChat() { $("#chat").hidden = false; $("#fab").hidden = true; if (!chat.length) { chat.push({ role: "a", text: "I can explain findings, point to the files that need attention and list what to ask an institution for. I can't approve or reject: an authorised official does that." }); renderMsgs(); } $("#chatInput").focus(); }
$("#fab").addEventListener("click", openChat);
$("#chatClose").addEventListener("click", () => { $("#chat").hidden = true; $("#fab").hidden = false; });
$("#chatForm").addEventListener("submit", e => { e.preventDefault(); const i = $("#chatInput"), q = i.value; i.value = ""; ask(q); });
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-chip]"); if (b) ask(b.dataset.chip); });

/* ---------- start ---------- */
S = load();
render();
(async () => { try { if (window.claude && window.claude.use) sampleFn = await window.claude.use("sample"); } catch (e) { sampleFn = null; } })();
</script>
